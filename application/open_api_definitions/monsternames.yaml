# Terraform template: monster paths and tags come from modules/data/monsters.tf.
# include_integrations is "false" for the public copy served at /openapi, which
# leaves out the x-amazon-apigateway-integration blocks and the ARNs in them.

openapi: 3.0.1
info:
  title: Monsternames - OpenAPI 3.0
  description: |-
    This is a relatively simple RESTAPI, based on the OpenAPI 3.0 specification, which generates pseudo-random names for
    common fantasy monsters.
  contact:
    name: Sudoblark Ltd
    url: https://github.com/sudoblark/sudoblark.monsternames.api
  license:
    name: BSD 3 clause
    url: https://raw.githubusercontent.com/sudoblark/sudoblark.monsternames.api/refs/heads/main/LICENSE.txt
  version: 3.0.0
externalDocs:
  description: Source Code
  url: https://github.com/sudoblark/sudoblark.monsternames.api
servers:
  - url: https://monsternames.sudoblark.com
tags:
%{ for monster in jsondecode(monsters) ~}
  - name: ${monster.name}
    description: ${jsonencode(monster.description)}
%{ endfor ~}
paths:
  /:
    get:
      summary: Show Swagger UI
%{ if include_integrations == "true" ~}
      x-amazon-apigateway-integration:
        httpMethod: "GET"
        uri: "arn:aws:apigateway:${aws_region_name}:s3:path//${asset_bucket_name}/${swagger_index_path}"
        credentials: "${api_gateway_iam_role_arn}"
        type: "aws"
        passthroughBehavior : "when_no_match"
        responses:
          "default": {
            "statusCode": "200",
            "responseParameters": {
              "method.response.header.Content-Type": "'text/html'"
            }
          }
%{ endif ~}
      responses:
        "200":
          description: "Successful request"
          content:
            text/html:
              schema:
                type: string
          headers:
            "Content-Type":
              $ref: '#/components/headers/Content-Type'

  /openapi:
    get:
      summary: Get OpenAPI specification
      description: Returns the OpenAPI 3.0 specification for this API
%{ if include_integrations == "true" ~}
      x-amazon-apigateway-integration:
        httpMethod: "GET"
        uri: "arn:aws:apigateway:${aws_region_name}:s3:path//${asset_bucket_name}/open_api_definitions/monsternames.yaml"
        credentials: "${api_gateway_iam_role_arn}"
        type: "aws"
        passthroughBehavior: "when_no_match"
        responses:
          "default":
            statusCode: "200"
            responseParameters:
              "method.response.header.Content-Type": "'application/x-yaml'"
              "method.response.header.Access-Control-Allow-Origin": "'*'"
%{ endif ~}
      responses:
        "200":
          description: "OpenAPI specification in YAML format"
          content:
            application/x-yaml:
              schema:
                type: string
          headers:
            "Content-Type":
              schema:
                type: string
                description: YAML content type
            "Access-Control-Allow-Origin":
              schema:
                type: string
                description: CORS header for Swagger UI

%{ for monster in jsondecode(monsters) ~}
  /${monster.name}:
    get:
      summary: Retrieve a pseudo-random name
      tags:
        - ${monster.name}
%{ if include_integrations == "true" ~}
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${aws_region_name}:lambda:path/2015-03-31/functions/${backend_lambda_arn}/invocations"
        type: "aws_proxy"
        passthroughBehavior: "when_no_match"
%{ endif ~}
      responses:
        "200":
          $ref: "#/components/responses/${try(monster.last_names_path, null) == null ? "200GetFirstName" : "200GetFirstAndLastName"}"
        "500":
          $ref: "#/components/responses/500InternalError"
%{ endfor ~}

# API Gateway answers routes and methods it doesn't serve with a 403 Missing
# Authentication Token. Return the Lambda's own 404 instead.
x-amazon-apigateway-gateway-responses:
  MISSING_AUTHENTICATION_TOKEN:
    statusCode: "404"
    responseTemplates:
      application/json: '{"error": "Endpoint does not exist"}'

components:
  headers:
    Content-Type:
      schema:
        type: string
        description: Type of content to return

  schemas:
    ErrorModel:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: Error type identifier
        message:
          type: string
          description: Human-readable error message

  responses:
    200GetFirstName:
      description: "Successful response"
      content:
        application/json:
          schema:
            type: object
            required:
            - first_name
            - full_name
            properties:
              first_name:
                type: string
                description: Randomly selected first name
              full_name:
                type: string
                description: Complete formatted name
          examples:
            goatmen:
              value:
                first_name: "Fluffy"
                full_name: "Fluffy"

    200GetFirstAndLastName:
      description: "Successful response"
      content:
        application/json:
          schema:
            type: object
            required:
            - first_name
            - last_name
            - full_name
            properties:
              first_name:
                type: string
                description: Randomly selected first name
              last_name:
                type: string
                description: Randomly selected last name or title
              full_name:
                type: string
                description: Complete formatted name
          examples:
            goblin:
              value:
                first_name: "Dave"
                last_name: "The Accountant"
                full_name: "Dave The Accountant"

    500InternalError:
      description: "Internal server error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
          examples:
            server_error:
              value:
                error: "InternalServerError"
                message: "An unexpected error occurred while processing your request"