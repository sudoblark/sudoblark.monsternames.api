openapi: 3.0.1
info:
  title: Monsternames - OpenAPI 3.0
  description: |-
    This is a relatively simple RESTAPI, based on the OpenAPI 3.0 specification, which generates pseudo-random names for
    common fantasy monsters.
  contact:
    name: Sudoblark Ltd
    url: https://github.com/sudoblark/sudoblark.monsternames.api
  license:
    name: BSD 3 clause
    url: https://raw.githubusercontent.com/sudoblark/sudoblark.monsternames.api/refs/heads/main/LICENSE.txt
  version: 3.0.0
externalDocs:
  description: Source Code
  url: https://github.com/sudoblark/sudoblark.monsternames.api
servers:
  - url: https://monsternames.sudoblark.com
tags:
  - name: goatmen
    description: Names themed on cute fluffy animals
  - name: goblin
    description: Names themed on washed out wrestlers/average blokes
  - name: ogre
    description: Names themed on cavemen like speech
  - name: orc
    description: Names themed on {noun} + {silly moniker}
  - name: skeleton
    description: Names themed on 18th Century British Gentlemen
  - name: troll
    description: Names themed on a Scandinavian twist
paths:
  /:
    get:
      summary: Show Swagger UI
      x-amazon-apigateway-integration:
        httpMethod: "GET"
        uri: "arn:aws:apigateway:${aws_region_name}:s3:path//${asset_bucket_name}/${swagger_index_path}"
        credentials: "${api_gateway_iam_role_arn}"
        type: "aws"
        passthroughBehavior : "when_no_match"
        responses:
          "default": {
            "statusCode": "200",
            "responseParameters": {
              "method.response.header.Content-Type": "'text/html'"
            }
          }
      responses:
        "200":
          description: "Successful request"
          content:
            text/html:
              schema:
                type: string
          headers:
            "Content-Type":
              $ref: '#/components/headers/Content-Type'

  /openapi:
    get:
      summary: Get OpenAPI specification
      description: Returns the OpenAPI 3.0 specification for this API
      x-amazon-apigateway-integration:
        httpMethod: "GET"
        uri: "arn:aws:apigateway:${aws_region_name}:s3:path//${asset_bucket_name}/open_api_definitions/monsternames.yaml"
        credentials: "${api_gateway_iam_role_arn}"
        type: "aws"
        passthroughBehavior: "when_no_match"
        responses:
          "default":
            statusCode: "200"
            responseParameters:
              "method.response.header.Content-Type": "'application/x-yaml'"
              "method.response.header.Access-Control-Allow-Origin": "'*'"
      responses:
        "200":
          description: "OpenAPI specification in YAML format"
          content:
            application/x-yaml:
              schema:
                type: string
          headers:
            "Content-Type":
              schema:
                type: string
                description: YAML content type
            "Access-Control-Allow-Origin":
              schema:
                type: string
                description: CORS header for Swagger UI

  /goatmen:
    get:
      summary: Retrieve a pseudo-random name
      tags:
        - goatmen
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${aws_region_name}:lambda:path/2015-03-31/functions/${backend_lambda_arn}/invocations"
        type: "aws_proxy"
        passthroughBehavior : "when_no_match"
      responses:
        "200":
          $ref: "#/components/responses/200GetFirstName"
        "500":
          $ref: "#/components/responses/500InternalError"

  /goblin:
    get:
      summary: Retrieve a pseudo-random name
      tags:
        - goblin
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${aws_region_name}:lambda:path/2015-03-31/functions/${backend_lambda_arn}/invocations"
        type: "aws_proxy"
        passthroughBehavior : "when_no_match"
      responses:
        "200":
          $ref: "#/components/responses/200GetFirstAndLastName"
        "500":
          $ref: "#/components/responses/500InternalError"

  /ogre:
    get:
      summary: Retrieve a pseudo-random name
      tags:
        - ogre
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${aws_region_name}:lambda:path/2015-03-31/functions/${backend_lambda_arn}/invocations"
        type: "aws_proxy"
        passthroughBehavior : "when_no_match"
      responses:
        "200":
          $ref: "#/components/responses/200GetFirstName"
        "500":
          $ref: "#/components/responses/500InternalError"

  /orc:
    get:
      summary: Retrieve a pseudo-random name
      tags:
        - orc
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${aws_region_name}:lambda:path/2015-03-31/functions/${backend_lambda_arn}/invocations"
        type: "aws_proxy"
        passthroughBehavior : "when_no_match"
      responses:
        "200":
          $ref: "#/components/responses/200GetFirstAndLastName"
        "500":
          $ref: "#/components/responses/500InternalError"

  /skeleton:
    get:
      summary: Retrieve a pseudo-random name
      tags:
        - skeleton
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${aws_region_name}:lambda:path/2015-03-31/functions/${backend_lambda_arn}/invocations"
        type: "aws_proxy"
        passthroughBehavior : "when_no_match"
      responses:
        "200":
          $ref: "#/components/responses/200GetFirstAndLastName"
        "500":
          $ref: "#/components/responses/500InternalError"

  /troll:
    get:
      summary: Retrieve a pseudo-random name
      tags:
        - troll
      x-amazon-apigateway-integration:
        httpMethod: "POST"
        uri: "arn:aws:apigateway:${aws_region_name}:lambda:path/2015-03-31/functions/${backend_lambda_arn}/invocations"
        type: "aws_proxy"
        passthroughBehavior : "when_no_match"
      responses:
        "200":
          $ref: "#/components/responses/200GetFirstAndLastName"
        "500":
          $ref: "#/components/responses/500InternalError"

components:
  headers:
    Content-Type:
      schema:
        type: string
        description: Type of content to return

  schemas:
    ErrorModel:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: Error type identifier
        message:
          type: string
          description: Human-readable error message

  responses:
    200GetFirstName:
      description: "Successful response"
      content:
        application/json:
          schema:
            type: object
            required:
            - first_name
            - full_name
            properties:
              first_name:
                type: string
                description: Randomly selected first name
              full_name:
                type: string
                description: Complete formatted name
          examples:
            goatmen:
              value:
                first_name: "Fluffy"
                full_name: "Fluffy"

    200GetFirstAndLastName:
      description: "Successful response"
      content:
        application/json:
          schema:
            type: object
            required:
            - first_name
            - last_name
            - full_name
            properties:
              first_name:
                type: string
                description: Randomly selected first name
              last_name:
                type: string
                description: Randomly selected last name or title
              full_name:
                type: string
                description: Complete formatted name
          examples:
            goblin:
              value:
                first_name: "Dave"
                last_name: "The Accountant"
                full_name: "Dave The Accountant"

    500InternalError:
      description: "Internal server error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
          examples:
            server_error:
              value:
                error: "InternalServerError"
                message: "An unexpected error occurred while processing your request"